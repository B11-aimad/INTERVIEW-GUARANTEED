<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
(function mountAmbientBackground() {
  const doc = window.parent.document;
  if (doc.getElementById("eg-ambient-canvas")) return;

  const canvas = doc.createElement("canvas");
  canvas.id = "eg-ambient-canvas";
  Object.assign(canvas.style, {
    position: "fixed",
    inset: "0",
    width: "100vw",
    height: "100vh",
    zIndex: "0",
    pointerEvents: "none",
    opacity: "0.65"
  });
  doc.body.prepend(canvas);

  const ctx = canvas.getContext("2d");
  let w = 0, h = 0, mx = 0.5, my = 0.5;

  function resize() {
    w = canvas.width = window.parent.innerWidth;
    h = canvas.height = window.parent.innerHeight;
  }
  resize();
  window.parent.addEventListener("resize", resize);

  doc.addEventListener("mousemove", (e) => {
    mx = e.clientX / Math.max(1, w);
    my = e.clientY / Math.max(1, h);
  });

  const nodes = Array.from({ length: 24 }, (_, i) => ({
    x: Math.random(),
    y: Math.random(),
    r: 1.8 + (i % 3) * 1.1,
    vx: (Math.random() - 0.5) * 0.00022,
    vy: (Math.random() - 0.5) * 0.00022,
    emerald: i % 2 === 0
  }));

  function render() {
    ctx.clearRect(0, 0, w, h);

    const gx = (mx * 0.65 + 0.18) * w;
    const gy = (my * 0.65 + 0.18) * h;
    const grad = ctx.createRadialGradient(gx, gy, 24, gx, gy, Math.max(w, h) * 0.45);
    grad.addColorStop(0, "rgba(5, 150, 105, 0.07)");
    grad.addColorStop(0.55, "rgba(3, 105, 161, 0.04)");
    grad.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    const pts = nodes.map((n) => {
      n.x = (n.x + n.vx + 1) % 1;
      n.y = (n.y + n.vy + 1) % 1;
      return { x: n.x * w, y: n.y * h, r: n.r, emerald: n.emerald };
    });

    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
        if (d < 135) {
          ctx.strokeStyle = `rgba(15, 23, 42, ${((1 - d / 135) * 0.07).toFixed(3)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      }
    }

    pts.forEach((p) => {
      ctx.fillStyle = p.emerald ? "rgba(5, 150, 105, 0.32)" : "rgba(3, 105, 161, 0.28)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    requestAnimationFrame(render);
  }

  render();
})();
</script>
</body>
</html>
