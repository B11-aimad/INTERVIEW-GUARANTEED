<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="matrix3d"></canvas>
<script>
const canvas = document.getElementById("matrix3d");
const ctx = canvas.getContext("2d");

let w, h;
let mx = 0, my = 0;
let rotX = 0.28, rotY = 0;

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function updateMouse(clientX, clientY) {
  mx = (clientX / w - 0.5) * 2;
  my = (clientY / h - 0.5) * 2;
}
window.addEventListener("mousemove", (e) => updateMouse(e.clientX, e.clientY));
try {
  window.parent.document.addEventListener("mousemove", (e) => updateMouse(e.clientX, e.clientY));
} catch (e) {}

function project(x, y, z) {
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const x1 = x * cosY - z * sinY;
  const z1 = z * cosY + x * sinY;

  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  const y1 = y * cosX - z1 * sinX;
  const z2 = z1 * cosX + y * sinX;

  const fov = 540;
  const scale = fov / Math.max(90, 620 + z2);
  return {
    x: w * 0.5 + x1 * scale,
    y: h * 0.52 + y1 * scale,
    scale,
    z: z2
  };
}

// Anneau 3D de points (topologie réseau façon 1337)
const particles = Array.from({ length: 65 }, (_, i) => {
  const phi = Math.acos(-1 + (2 * i) / 65);
  const theta = Math.sqrt(65 * Math.PI) * phi;
  const r = 240;
  return {
    x: r * Math.cos(theta) * Math.sin(phi),
    y: r * Math.sin(theta) * Math.sin(phi),
    z: r * Math.cos(phi),
    highlight: i % 6 === 0
  };
});

let t = 0;

function render() {
  t += 0.006;
  rotY += ((mx * 0.6 + t) - rotY) * 0.05;
  rotX += ((0.25 + my * 0.25) - rotX) * 0.05;

  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, w, h);

  // Grille 3D basse contrastée vert néon subtil
  const span = 950, step = 95, floor = 185;
  ctx.lineWidth = 1;
  for (let x = -span; x <= span; x += step) {
    const a = project(x, floor, -span);
    const b = project(x, floor, span);
    ctx.strokeStyle = "rgba(0, 255, 102, 0.08)";
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  for (let z = -span; z <= span; z += step) {
    const a = project(-span, floor, z);
    const b = project(span, floor, z);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // Sphère 3D de matching d'offres
  const proj = particles.map((p) => ({ ...project(p.x, p.y, p.z), hi: p.highlight }));

  for (let i = 0; i < proj.length; i++) {
    for (let j = i + 1; j < proj.length; j++) {
      const d = Math.hypot(proj[i].x - proj[j].x, proj[i].y - proj[j].y);
      if (d < 95) {
        const alpha = (1 - d / 95) * 0.24;
        ctx.strokeStyle = `rgba(0, 255, 102, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.moveTo(proj[i].x, proj[i].y);
        ctx.lineTo(proj[j].x, proj[j].y);
        ctx.stroke();
      }
    }
  }

  proj.sort((a, b) => b.z - a.z);
  proj.forEach((p) => {
    ctx.fillStyle = p.hi ? "#00FF66" : "rgba(255, 255, 255, 0.72)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(1.5, (p.hi ? 3.5 : 2.1) * p.scale), 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
