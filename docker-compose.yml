services:
  db:
    image: postgres:16-alpine
    container_name: entretien_garanti_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-entretien_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entretien_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-entretien_garanti}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-entretien_user} -d ${POSTGRES_DB:-entretien_garanti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: entretien_garanti_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-entretien_user}:${POSTGRES_PASSWORD:-entretien_pass_2026}@db:5432/${POSTGRES_DB:-entretien_garanti}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: entretien_garanti_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata: